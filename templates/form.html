<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Edit' if application else 'Add' }} Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>{{ 'Edit Application' if application else 'Add Application' }}</h1>
        <a class="btn secondary" href="{{ url_for('main.index') }}">&larr; Back</a>
    </header>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" class="app-form">
        <label for="company_name">Company</label>
        <input type="text" id="company_name" name="company_name" required
               value="{{ application.company_name if application else '' }}">

        <label for="role">Role</label>
        <input type="text" id="role" name="role"
               value="{{ application.role if application else '' }}">

        {% if application %}
        <label for="status">Status</label>
        <select id="status" name="status">
            {% for s in statuses %}
                <option value="{{ s.name }}" {% if application.status == s %}selected{% endif %}>
                    {{ s.value }}
                </option>
            {% endfor %}
        </select>
        {% endif %}

        <label for="applied_date">Applied Date</label>
        <input type="date" id="applied_date" name="applied_date"
               value="{{ application.applied_date if application else '' }}">

        <label for="reminder_date">Reminder Date</label>
        <input type="date" id="reminder_date" name="reminder_date"
               value="{{ application.reminder_date if application and application.reminder_date else '' }}">

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4">{{ application.notes if application else '' }}</textarea>

        <button type="submit" class="btn">{{ 'Save Changes' if application else 'Add Application' }}</button>
    </form>
</body>
</html>
